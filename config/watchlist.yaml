algorithm: sha256
paths:
  - demo_files/etc/passwd
  - demo_files/etc/hosts
  - demo_files/home/authorized_keys


scan_interval: 60

ssh:
  log_path: demo_files/auth.log    # 本地开发用 demo；生产请改成 /var/log/auth.log
  window_seconds: 60
  threshold: 5

sudo:
  log_path: demo_files/auth.log    # 同一个 auth.log；生产同样改成 /var/log/auth.log
  window_seconds: 60
  threshold: 3                     # sudo 失败比 SSH 罕见，阈值更低

alert:
  dingtalk_webhook: ""
  dedup_window_seconds: 3600
  email_host: ""
  email_port: 587
  email_user: ""
  email_password: ""
  email_from: ""
  email_to: ""